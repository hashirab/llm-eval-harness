[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Measure LLM accuracy, hallucination and latency on your own test sets, and catch regressions in CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hashir Abdullah" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalharness = "evalharness.cli:main"

[tool.setuptools]
packages = ["evalharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
