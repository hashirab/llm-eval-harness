# Compare a local model with a hosted one, using two prompt styles.
name: security-summaries
dataset: ../datasets/security_incidents.jsonl
repeats: 3            # run each case several times: LLM outputs are non-deterministic
output_dir: ../runs

prompts:
  baseline: ../prompts/baseline.txt
  structured: ../prompts/structured.txt

models:
  - provider: ollama
    model: llama3.1:8b
    temperature: 0.7
  - provider: gemini
    model: gemini-3.8-flash   # check current names in Google AI Studio if this 404s
    temperature: 0.7
